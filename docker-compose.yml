services:
  app:
    image: ahmadrafii07/weblsp:1.0
    restart: always
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bengkel_mobil
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db
    networks:
      - uji-net

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: bengkel_mobil
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - uji-net

  nginx:
    image: nginx:latest
    container_name: nginx-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - uji-net

networks:
  uji-net:
    driver: bridge

volumes:
  dbdata: