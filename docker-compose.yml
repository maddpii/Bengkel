services:
  app:
    image: ahmadrafii07/webujikom:1.2
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bengkel-app-1
    restart: always
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://bengkelrapii.com
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: bengkel_mobil
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - app_storage:/var/www/html/storage
      - public_storage:/var/www/html/storage/app/public
    networks:
      - uji-net

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: bengkel_mobil
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - uji-net

  nginx:
    image: nginx:latest
    container_name: nginx-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:ro
      - public_storage:/var/www/html/public/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - uji-net

networks:
  uji-net:
    driver: bridge

volumes:
  dbdata:
  app_storage:
  public_storage:
